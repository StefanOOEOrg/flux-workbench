[project]
name = "flux-workbench"
version = "0.1.0"
description = "Local project manager for FLUX renderings (server part)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn>=0.37,<1",
    "httpx>=0.28,<1",
]

[project.scripts]
flux-workbench = "flux_workbench.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "respx>=0.23",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/flux_workbench"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["server"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
