name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check server
      - run: uv run ruff format --check server
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node node_modules/@angular/cli/bin/ng.js test --watch=false
      - run: node node_modules/eslint/bin/eslint.js
      - run: node node_modules/prettier/bin/prettier.cjs --check "src/**/*.{ts,html,css}"
      - run: node node_modules/typescript/bin/tsc -p tsconfig.app.json --noEmit
      - run: node node_modules/typescript/bin/tsc -p tsconfig.spec.json --noEmit
      - run: npm run build
