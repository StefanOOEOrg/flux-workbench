@if (store.selectedProject() === null) {
  <p>Projekt auswählen</p>
} @else if (store.images().length === 0) {
  <p>Noch keine Bilder</p>
} @else {
  <div class="strip">
    @for (n of store.images(); track n) {
      <figure
        data-testid="thumb"
        tabindex="0"
        [class.selected]="n === store.selectedImage()"
        (click)="store.selectImage(n)"
        (keydown.enter)="store.selectImage(n)"
        (dblclick)="store.openImage(n)"
      >
        <img [src]="store.imageUrl(n)" loading="lazy" [alt]="'Bild ' + n" />
        <figcaption>{{ n }}</figcaption>
      </figure>
    }
  </div>
}
