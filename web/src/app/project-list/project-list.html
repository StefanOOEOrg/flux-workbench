<div class="create-row">
  <input
    data-testid="new-name"
    [value]="newName()"
    (input)="newName.set($any($event.target).value)"
    (keydown.enter)="create()"
    placeholder="Neues Projekt"
  />
  <button data-testid="create" (click)="create()">Neu</button>
</div>

@if (store.projects().length === 0) {
  <p>Noch keine Projekte</p>
} @else {
  <ul class="projects">
    @for (id of store.projects(); track id) {
      <li
        data-testid="project"
        tabindex="0"
        [class.selected]="id === store.selectedProject()"
        (click)="store.selectProject(id)"
        (keydown.enter)="store.selectProject(id)"
      >
        <span class="name">{{ id }}</span>
        <button data-testid="delete" (click)="remove(id, $event)">Löschen</button>
      </li>
    }
  </ul>
}
