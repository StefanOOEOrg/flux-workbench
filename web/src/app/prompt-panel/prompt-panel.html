<h2>
  Prompt
  @if (store.promptModified()) {
    <span data-testid="prompt-modified" class="modified">· modified</span>
  }
</h2>
<textarea
  data-testid="f-prompt"
  class="prompt"
  [value]="store.form().prompt"
  (input)="setPrompt($any($event.target).value)"
></textarea>
<h2>Negative Prompt</h2>
<textarea
  data-testid="f-negative"
  class="negative"
  placeholder="empty = off (otherwise real CFG, ~1.5× time)"
  [value]="store.form().negative ?? ''"
  (input)="setNegative($any($event.target).value)"
></textarea>
<button
  type="button"
  data-testid="submit"
  class="primary"
  [disabled]="store.selectedProject() === null"
  (click)="store.submit()"
>
  ▶ Render · image {{ store.nextImageNumber() }}
</button>
